[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-server"
version = "0.1.0"
description = "ASGI process entry for the Agent Platform plugin runtime"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-app-boot>=0.1,<0.2",
    "agent-platform-http-api>=0.1,<0.2",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
