[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-cli"
version = "0.1.0"
description = "Agent Platform command line: headless turn and local server"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-app-boot>=0.1,<0.2",
    "agent-platform-agent-entry>=0.1,<0.2",
    "minidsh-cordis-plugin-loader>=0.1,<0.2",
    "minidsh-cordis-plugin-include>=0.1,<0.2",
    "minidsh-cordis-plugin-group>=0.1,<0.2",
    "agent-platform-server>=0.1,<0.2",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
minidsh = "agent_platform_cli.profiles:main"
agent-platform = "agent_platform_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
