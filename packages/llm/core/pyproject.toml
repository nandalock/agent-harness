[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-llm"
version = "0.1.0"
description = "Provider-neutral LLM service, canonical types and OpenAI-compatible adapter"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_llm"]

[tool.setuptools.package-dir]
agent_platform_llm = "src"
