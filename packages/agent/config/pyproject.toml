[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-agent-config"
version = "0.1.0"
description = "Database-backed agent definitions, configs and tool bindings"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.agent-config" = "agent_platform_agent_config:AgentConfigPlugin"

[tool.setuptools]
packages = ["agent_platform_agent_config"]

[tool.setuptools.package-dir]
agent_platform_agent_config = "src"
