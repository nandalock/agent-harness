[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-agent-loop"
version = "0.1.0"
description = "Plugin-owned event-driven LLM and tool agent loop"
requires-python = ">=3.12"
dependencies = [
  "agent-platform-agents>=0.1,<0.2",
  "agent-platform-session>=0.1,<0.2",
  "agent-platform-llm>=0.1,<0.2",
  "agent-platform-tool-host>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_agent_loop"]

[tool.setuptools.package-dir]
agent_platform_agent_loop = "src"
