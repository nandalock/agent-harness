[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-system-prompt"
version = "0.1.0"
description = "Runtime-scoped system prompt registry and assembly"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-tool-host>=0.1,<0.2",
    "agent-platform-tool-system>=0.1,<0.2",
    "agent-platform-sandbox>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.system-prompt" = "agent_platform_system_prompt:SystemPromptPlugin"

[tool.setuptools]
packages = ["agent_platform_system_prompt"]

[tool.setuptools.package-dir]
agent_platform_system_prompt = "src"
