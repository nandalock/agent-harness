[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-agent-runtime"
version = "0.1.0"
description = "Plugin-owned agent request assembly and execution lifecycle"
requires-python = ">=3.12"
dependencies = ["agent-platform-plugin-sdk>=0.1,<0.2", "agent-platform-agents>=0.1,<0.2", "agent-platform-session>=0.1,<0.2", "agent-platform-llm>=0.1,<0.2"]

[tool.setuptools]
packages = ["agent_platform_agent_runtime"]

[tool.setuptools.package-dir]
agent_platform_agent_runtime = "src"
