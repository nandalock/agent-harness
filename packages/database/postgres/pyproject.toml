[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-database-postgres"
version = "0.1.0"
description = "Pooled PostgreSQL connection service for plugin runtimes"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9",
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_database_postgres"]

[tool.setuptools.package-dir]
agent_platform_database_postgres = "src"
