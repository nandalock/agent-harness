[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-overleaf-mcp"
version = "0.1.0"
description = "Overleaf MCP launcher and server registration for the Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg2-binary>=2.9", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["build>=1"]

[tool.setuptools.packages.find]
where = ["src"]
