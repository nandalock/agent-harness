[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-paper-mcp"
version = "0.1.0"
description = "Paper search/fetch/summarize MCP server for the Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["mcp>=1.30,<2", "aiohttp>=3.9", "pypdf>=4"]

[project.optional-dependencies]
dev = ["build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform_paper_mcp = ["llm.config.example.json"]
