[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-example-echo"
version = "0.1.0"
description = "Example echo plugin for the Agent Platform plugin runtime"
requires-python = ">=3.12"
dependencies = ["agent-platform-plugin-sdk>=0.1,<0.2"]

[project.entry-points."agent_platform.plugins"]
"example.echo" = "example_echo_plugin:EchoPlugin"

[tool.setuptools.packages.find]
where = ["src"]
