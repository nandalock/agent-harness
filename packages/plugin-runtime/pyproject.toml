[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-plugin-runtime"
version = "0.1.0"
description = "YAML-driven plugin discovery, dependency resolution and lifecycle for minidsh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10", "types-PyYAML>=6"]

[project.urls]
Source = "https://github.com/nandalock/agent-low-code-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform_plugin_runtime = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Editable development resolves the sibling source tree instead of an index.
[tool.uv.sources]
agent-platform-plugin-sdk = { path = "../plugin-sdk", editable = true }
