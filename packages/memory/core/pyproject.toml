[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-chat>=0.1,<0.2",
    "agent-platform-llm>=0.1,<0.2",
    "agent-platform-session>=0.1,<0.2",
    "agent-platform-session-persistence>=0.1,<0.2",
    "langchain-core>=1,<2",
    "langchain-openai>=1,<2",
]

[tool.setuptools]
packages = ["agent_platform_memory"]

[tool.setuptools.package-dir]
agent_platform_memory = "src"

[tool.setuptools.package-data]
agent_platform_memory = ["web/client.json", "web/client.js"]
