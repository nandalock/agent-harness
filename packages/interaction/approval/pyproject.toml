[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-user-approval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_user_approval"]

[tool.setuptools.package-dir]
agent_platform_user_approval = "src"
