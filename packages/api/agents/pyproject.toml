[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-api-agents"
version = "0.1.0"
description = "Agent controller and RPC methods"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-rpc-gateway>=0.1,<0.2",
    "agent-platform-agent-config>=0.1,<0.2",
    "agent-platform-llm>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.api-agents" = "agent_platform_api_agents:AgentApiPlugin"

[tool.setuptools]
packages = ["agent_platform_api_agents"]

[tool.setuptools.package-dir]
agent_platform_api_agents = "src"

[tool.setuptools.package-data]
agent_platform_api_agents = ["web/client.json", "web/client.js"]
