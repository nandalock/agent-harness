[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-rpc-gateway"
version = "0.1.0"
description = "Explicit JSON-RPC method registration and dispatch"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_rpc_gateway"]

[tool.setuptools.package-dir]
agent_platform_rpc_gateway = "src"
