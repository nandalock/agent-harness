[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-rpc-connection"
version = "0.1.0"
description = "Carrier-neutral JSON-RPC 2.0 connection"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-rpc-gateway>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.rpc-connection" = "agent_platform_rpc_connection:RpcConnectionPlugin"

[tool.setuptools]
packages = ["agent_platform_rpc_connection"]

[tool.setuptools.package-dir]
agent_platform_rpc_connection = "src"
