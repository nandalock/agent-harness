[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-plugin-sdk"
version = "0.1.0"
description = "Plugin lifecycle and capability contracts for minidsh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "packaging>=23"]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform_plugin_sdk = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "examples"]
