[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-faq"
version = "0.1.0"
description = "Tenant FAQ CRUD, matching and vectorization as an Agent Platform plugin"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform_faq = ["web/client.json", "web/client.js"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
