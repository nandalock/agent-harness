[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-session-persistence-postgres"
version = "0.1.0"
description = "PostgreSQL backend for the session event log"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-session>=0.1,<0.2",
    "agent-platform-session-persistence>=0.1,<0.2",
    "psycopg2-binary>=2.9",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.session-persistence-postgres" = "agent_platform_session_persistence_postgres:PostgresPersistencePlugin"

[tool.setuptools]
packages = ["agent_platform_session_persistence_postgres"]

[tool.setuptools.package-dir]
agent_platform_session_persistence_postgres = "src"
