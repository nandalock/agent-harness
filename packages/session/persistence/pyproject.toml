[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-session-persistence"
version = "0.1.0"
description = "Durable session event-log persistence seam"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-agents>=0.1,<0.2",
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-session>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_session_persistence"]

[tool.setuptools.package-dir]
agent_platform_session_persistence = "src"
