[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh-cordis-plugin-loader"
version = "0.1.0"
description = "YAML loader and profile composition for minidsh Cordis plugins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minidsh-cordis==0.1.0+minidsh.3",
    "minidsh-cordis-plugin-group>=0.1,<0.2",
    "minidsh-cordis-plugin-include>=0.1,<0.2",
    "packaging>=23",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10"]

[project.urls]
Source = "https://github.com/nandalock/agent-low-code-platform"

[tool.setuptools]
packages = ["minidsh_cordis_plugin_loader"]

[tool.setuptools.package-dir]
minidsh_cordis_plugin_loader = "src"

[tool.setuptools.package-data]
minidsh_cordis_plugin_loader = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# Editable development resolves the sibling source tree instead of an index.
[tool.uv.sources]
minidsh-cordis = { path = "../cordis", editable = true }
minidsh-cordis-plugin-group = { path = "../group", editable = true }
minidsh-cordis-plugin-include = { path = "../include", editable = true }
