[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh-cordis-plugin-group"
version = "0.1.0"
description = "Enablement rules for Cordis plugin groups"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[tool.setuptools]
packages = ["minidsh_cordis_plugin_group"]

[tool.setuptools.package-dir]
minidsh_cordis_plugin_group = "src"

[tool.setuptools.package-data]
minidsh_cordis_plugin_group = ["py.typed"]
