[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidsh-cordis-plugin-hmr"
version = "0.1.0"
description = "Asynchronous configuration watching for Cordis hosts"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
packages = ["minidsh_cordis_plugin_hmr"]

[tool.setuptools.package-dir]
minidsh_cordis_plugin_hmr = "src"

[tool.setuptools.package-data]
minidsh_cordis_plugin_hmr = ["py.typed"]
