[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-settings-postgres"
version = "0.1.0"
description = "Database-backed settings.v1 service"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.settings-postgres" = "agent_platform_settings_postgres:PostgresSettingsPlugin"

[tool.setuptools]
packages = ["agent_platform_settings_postgres"]

[tool.setuptools.package-dir]
agent_platform_settings_postgres = "src"
