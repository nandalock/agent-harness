[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-agent-entry>=0.1,<0.2",
    "agent-platform-agent-runtime>=0.1,<0.2",
    "agent-platform-agents>=0.1,<0.2",
    "agent-platform-session>=0.1,<0.2",
    "agent-platform-session-persistence>=0.1,<0.2",
    "agent-platform-session-projection>=0.1,<0.2",
]

[project.entry-points."agent_platform.plugins"]
"agent-platform.chat" = "agent_platform_chat:ChatPlugin"

[tool.setuptools]
packages = ["agent_platform_chat"]

[tool.setuptools.package-dir]
agent_platform_chat = "src"

[tool.setuptools.package-data]
agent_platform_chat = ["web/client.json", "web/client.js"]
