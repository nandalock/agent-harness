[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-http-api"
version = "0.1.0"
description = "FastAPI HTTP/API plugin for the plugin platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "pyjwt>=2,<3",
    "python-multipart>=0.0.18",
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-agent-entry>=0.1,<0.2",
    "agent-platform-chat>=0.1,<0.2",
    "agent-platform-memory>=0.1,<0.2",
    "agent-platform-user-approval>=0.1,<0.2",
    "agent-platform-rpc-connection>=0.1,<0.2",
    "agent-platform-api-agents>=0.1,<0.2",
    "agent-platform-api-sessions>=0.1,<0.2",
    "agent-platform-api-workspace>=0.1,<0.2",
    "agent-platform-system-prompt>=0.1,<0.2",
    "agent-platform-faq>=0.1,<0.2",
    "agent-platform-xianyu>=0.1,<0.2",
    "agent-platform-workflow>=0.1,<0.2",
    "agent-platform-mcp-client>=0.1,<0.2",
    "agent-platform-skills>=0.1,<0.2",
    "agent-platform-sandbox>=0.1,<0.2",
    "agent-platform-plugin-inventory>=0.1,<0.2",
]

[tool.setuptools]
packages = ["agent_platform_http_api", "agent_platform_http_api.routes"]

[tool.setuptools.package-dir]
agent_platform_http_api = "src"
