[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-skills-filesystem"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["agent-platform-skills>=0.1,<0.2"]

[project.entry-points."agent_platform.plugins"]
"agent-platform.skills-filesystem" = "agent_platform_skills_filesystem:SkillsFilesystemPlugin"

[tool.setuptools]
packages = ["agent_platform_skills_filesystem"]

[tool.setuptools.package-dir]
agent_platform_skills_filesystem = "src"

[tool.setuptools.package-data]
agent_platform_skills_filesystem = ["builtin/**/*"]

[tool.uv.sources]
agent-platform-skills = { path = "../core", editable = true }
