[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-skills"
version = "0.1.0"
description = "Skill discovery, loading and installation for the Agent Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["agent-platform-plugin-sdk>=0.1,<0.2", "PyYAML>=6,<7", "aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10"]

[tool.setuptools]
packages = ["agent_platform_skills"]

[tool.setuptools.package-dir]
agent_platform_skills = "src"

[tool.setuptools.package-data]
agent_platform_skills = ["py.typed"]

[tool.mypy]
# This package is a lift-and-shift of previously untyped backend modules.
# Keep basic checking while annotations are added incrementally.
python_version = "3.12"
files = ["src"]
check_untyped_defs = true

[tool.uv.sources]
agent-platform-plugin-sdk = { path = "../../../plugin/sdk", editable = true }
