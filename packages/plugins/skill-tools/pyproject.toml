[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-skill-tools"
version = "0.1.0"
description = "Skill loading and installation tools as an Agent Platform plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "agent-platform-skills>=0.1,<0.2",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10"]

[project.entry-points."agent_platform.plugins"]
"agent-platform.skill-tools" = "agent_platform_skill_tools:SkillToolsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform_skill_tools = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.uv.sources]
agent-platform-plugin-sdk = { path = "../../plugin-sdk", editable = true }
agent-platform-skills = { path = "../../skills", editable = true }
