[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-platform-mcp-client"
version = "0.1.0"
description = "MCP server tools as an Agent Platform plugin"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-platform-plugin-sdk>=0.1,<0.2",
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10"]

[tool.setuptools]
packages = ["agent_platform_mcp_client"]

[tool.setuptools.package-dir]
agent_platform_mcp_client = "src"

[tool.setuptools.package-data]
agent_platform_mcp_client = ["py.typed", "web/client.json", "web/client.js"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.uv.sources]
agent-platform-plugin-sdk = { path = "../../../plugin/sdk", editable = true }
